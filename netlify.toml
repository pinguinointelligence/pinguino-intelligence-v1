# Netlify deploy config for the PINGÜINO client-only Vite SPA.
# INERT until a Netlify site is connected — reading this file has no effect on local
# dev, CI, tests, or the build. Pick ONE host (this or vercel.json), then set the two
# public env vars (VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY) in the host dashboard.
# See docs/deploy/DEPLOYMENT.md.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Client-side routing (react-router BrowserRouter): every non-asset path must serve
# the SPA shell so deep links like /studio or /my-recipes resolve. Real static assets
# under /assets are served directly and never hit this catch-all.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Direct recipe shares are UNLISTED (§11/§46): a secure token is the only key,
# so the page must never be indexed, archived, or stored in a shared cache, and
# the token must never travel outward in a Referer header. The SPA also emits a
# `noindex` meta tag, but a crawler that does not run JavaScript would never see
# it — this header is the authority. Mirrored in vercel.json.
[[headers]]
  for = "/share/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "private, no-store"
    Referrer-Policy = "no-referrer"
