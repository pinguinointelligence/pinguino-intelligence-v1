name: CI

# `staging` is the deployment branch. Until 2026-08-29 this workflow ran only
# for `main`, which has been frozen since 2026-07-23 — so 270 consecutive
# commits reached staging (and the live staging deployment) with no typecheck,
# no lint, no tests and no build. That is the permissive condition behind every
# regression the provenance audit found. staging is now gated like main.
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  # Fast, always-required gate. Ordered cheapest-first so a broken contract is
  # reported in seconds rather than after the full suite.
  contracts:
    name: Owner-locked contracts + protected paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The guards diff against the base branch, so they need real history.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # No stray conflict markers or whitespace damage — cheap, catches a
      # botched conflict resolution before anything else runs.
      - name: Whitespace and conflict-marker check
        run: git diff --check "$(git merge-base origin/${{ github.base_ref || 'staging' }} HEAD)" HEAD

      # An implementation task must not be able to edit an accepted contract and
      # declare success.
      - name: Owner-locked contract guard
        run: node scripts/guardOwnerLockedContracts.mjs --base "origin/${{ github.base_ref || 'staging' }}"

      # A design/language/cleanup task must produce ZERO semantic drift on a
      # protected functional path. Commit names are not trusted; the diff is
      # classified.
      - name: Protected functional path diff gate
        run: node scripts/guardProtectedPaths.mjs --base "origin/${{ github.base_ref || 'staging' }}"

      # The accepted behaviour itself.
      - name: Owner-locked regression contracts
        run: npm run test:contracts

  verify:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest
    # Two accepted contracts describe the environment they were accepted in,
    # and a default runner does not provide it. Neither is a code defect and
    # neither test is touched — the RUNNER is corrected to observe them:
    #
    #   * `gellattiStabilizerAuthority` reads a historical git object
    #     (`git show 7edd90ea:…/mapper_basement.csv`), which a shallow
    #     checkout does not contain — hence `fetch-depth: 0` below.
    #   * `myRecipesVersionSelector` and `historicalVersionNotice` assert the
    #     LOCAL calendar day of an immutable timestamp; their own comments say
    #     so („v1: 22.08 UTC = 23.08 local"). A UTC runner renders the previous
    #     day — hence the explicit TZ below.
    env:
      TZ: Europe/Madrid
    steps:
      - uses: actions/checkout@v4
        with:
          # A contract that verifies an accepted historical artefact needs the
          # history it verifies against.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Solver-heavy CORRECTNESS contracts. Corrected 2026-08-30 — the previous comment
  # here claimed this suite "asserts that a recipe vector resolves inside 5000 ms" and
  # that "the threshold is owner-locked". An audit found BOTH claims false: the file
  # contains no timing assertion of any kind, and no owner-locked contract,
  # AGENTS.md rule or protected path defines a solver runtime threshold. The 5000 ms
  # was simply Vitest's DEFAULT testTimeout.
  #
  # The suite runs separately so it does not compete with the full application suite,
  # and `vitest.solver-contracts.config.ts` gives it a 30 s harness allowance because
  # shared CI hardware is materially slower than local execution (measured: ~2.4-3.2 s
  # locally vs 4.5-5.2 s here, which straddled the old default and produced red builds
  # from unchanged code).
  #
  # Correctness and termination are enforced by the assertions themselves plus
  # bounded search and iteration caps — never by wall-clock timing. Per-test durations
  # below remain visible as diagnostics; they are not a gate.
  solver-contracts:
    name: Solver time contracts (isolated)
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Madrid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Diagnostic evidence, so any future sizing decision is measured rather than
      # assumed. Not a gate.
      - name: Record runner resources
        run: |
          echo "cores:  $(nproc)"
          echo "memory: $(free -h | awk '/^Mem:/{print $2}')"
          echo "load:   $(uptime)"

      # Runs through its OWN config, because the file is now excluded from the
      # default suite. A bare `vitest run <path>` would honour that exclusion and
      # match nothing — a vacuously green job, which is worse than the flake.
      - name: recipeVectorProximity — no competing workload
        run: npm run solver:contracts
